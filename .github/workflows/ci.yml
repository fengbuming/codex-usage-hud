name: CI

# Informational cross-platform test run.
#
# This workflow runs deterministic code-level coverage on every supported
# platform. The large legacy UI lifecycle module requires a real interactive
# Codex Desktop window and is exercised by the dedicated smoke workflow/local
# desktop validation instead of being run against headless hosted runners.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qt_regression:
        description: Run focused Linux Qt shutdown checks without the full suite
        type: boolean
        default: false
      qt_version:
        description: Optional candidate PySide6 version (empty uses the CI constraint)
        type: string
        default: ""

jobs:
  qt-regression:
    if: ${{ inputs.qt_regression }}
    name: Qt shutdown (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      QT_TEST_VERSION: ${{ inputs.qt_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
          if [ -n "$QT_TEST_VERSION" ]; then
            python -m pip install pytest -e . "PySide6==$QT_TEST_VERSION"
          else
            python -m pip install -c .github/requirements-ci.txt pytest -e ".[desktop-overlay]"
          fi
          python -m pip freeze
      - name: Run native regression tests including interpreter shutdown
        run: >-
          python -m pytest -q
          tests/test_work_overlay_rendering.py
          tests/test_renderer_recovery.py
          tests/test_desktop_overlay.py
          -m qt_ui

  preflight:
    if: ${{ !inputs.qt_regression }}
    name: Shared regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install pytest -e .
      - name: Run shared validation gate
        run: python tools/run_validation.py

  test:
    needs: preflight
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux system dependencies for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -c .github/requirements-ci.txt -e ".[desktop-overlay]"

      - name: Compile sources
        run: python -m compileall -q src tests tools

      - name: Run portable test suite
        run: >-
          python -m pytest -q
          -m "not ui and not qt_ui"
          --ignore=tests/test_ui.py
          --ignore=tests/test_window_tracker.py
          --ignore=tests/test_pricing_sync.py
          --ignore=tests/test_work_overlay_rendering.py

      # Native Qt rendering uses its own interpreter so shutdown failures
      # identify the relevant suite instead of obscuring portable test results.
      - name: Run native overlay rendering tests
        run: >-
          python -m pytest -q
          tests/test_work_overlay_rendering.py
          tests/test_renderer_recovery.py
          tests/test_desktop_overlay.py
          -m qt_ui

      - name: Run portable pricing synchronization tests
        run: python -m pytest -q tests/test_pricing_sync.py

      - name: Run Windows window-tracker tests
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_window_tracker.py
