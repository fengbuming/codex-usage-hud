name: OpenAI pricing snapshot

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openai-pricing-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record snapshot branch revision
        id: snapshot-base
        shell: bash
        run: |
          revision=$(git ls-remote --heads origin refs/heads/pricing-snapshot)
          echo "revision=${revision%%$'\t'*}" >> "$GITHUB_OUTPUT"
      - name: Fetch previous pricing catalog
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/pricing-snapshot:refs/remotes/origin/pricing-snapshot || true
          git show refs/remotes/origin/pricing-snapshot:docs/openai-pricing-snapshot.json > .previous-openai-pricing-snapshot.json || true
      - run: python tools/sync_openai_pricing.py --previous-snapshot .previous-openai-pricing-snapshot.json
      - name: Commit changed snapshot
        env:
          SNAPSHOT_BASE: ${{ steps.snapshot-base.outputs.revision }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/openai-pricing-snapshot.json src/codex_usage_hud/assets/openai-pricing-snapshot.json
          git diff --cached --quiet || git commit -m "chore: refresh OpenAI pricing snapshot"
          git push --force-with-lease="refs/heads/pricing-snapshot:$SNAPSHOT_BASE" origin HEAD:refs/heads/pricing-snapshot
