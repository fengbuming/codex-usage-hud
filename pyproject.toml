[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-usage-hud"
dynamic = ["version"]
description = "Local-first real-time token HUD and cost tracker for Codex App usage with accurate cached token pricing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "codex-usage-hud contributors" },
]
dependencies = []
keywords = [
  "Codex App token usage",
  "Codex usage tracker",
  "real-time token HUD",
  "cost tracker",
  "cached token cost",
  "local-first privacy",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fengbuming/codex-usage-hud"
Repository = "https://github.com/fengbuming/codex-usage-hud"
Documentation = "https://github.com/fengbuming/codex-usage-hud/tree/main/docs"
Changelog = "https://github.com/fengbuming/codex-usage-hud/blob/main/CHANGELOG.md"
Contributing = "https://github.com/fengbuming/codex-usage-hud/blob/main/CONTRIBUTING.md"
Privacy = "https://github.com/fengbuming/codex-usage-hud/blob/main/docs/PRIVACY.md"
Issues = "https://github.com/fengbuming/codex-usage-hud/issues"
Description = "https://github.com/fengbuming/codex-usage-hud#readme"

[project.optional-dependencies]
desktop-overlay = [
  "PySide6>=6.8",
]

[project.scripts]
codex-hud = "codex_usage_hud.cli:main"

[tool.hatch.version]
path = "src/codex_usage_hud/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_usage_hud"]

[tool.hatch.build.targets.wheel.force-include]
"src/codex_usage_hud/assets/sponsor_alipay.jpg" = "codex_usage_hud/assets/sponsor_alipay.jpg"
"src/codex_usage_hud/assets/sponsor_wechat.jpg" = "codex_usage_hud/assets/sponsor_wechat.jpg"
"src/codex_usage_hud/assets/sponsor_alipay.png" = "codex_usage_hud/assets/sponsor_alipay.png"
"src/codex_usage_hud/assets/sponsor_wechat.png" = "codex_usage_hud/assets/sponsor_wechat.png"
"icon/hud-app-icon.ico" = "codex_usage_hud/assets/hud-app-icon.ico"
"src/codex_usage_hud/assets/openai-pricing-snapshot.json" = "codex_usage_hud/assets/openai-pricing-snapshot.json"

[tool.pytest.ini_options]
addopts = "-m 'not ui' --tb=short -q"
markers = [
  "ui: real PySide6 widget lifecycle tests skipped by default",
  "qt_ui: real PySide6 desktop-helper widget lifecycle tests",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]
